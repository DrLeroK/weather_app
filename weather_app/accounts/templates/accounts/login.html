{% extends 'base.html' %}
{% load bootstrap4 %}
{% load static %}


{% block content %}
<div class="login-section">
    <div class="container">
        <div class="login-container">
            <div class="login-card">
                <i class="bi bi-sun weather-icon icon-sun"></i>
                <i class="bi bi-cloud weather-icon icon-cloud"></i>
                
                <h1 class="login-title">
                    <i class="bi bi-cloud-sun"></i> Welcome Back
                </h1>
                
                <form method="POST" class="login-form">
                    {% csrf_token %}
                    
                    {% bootstrap_form form %}
                    
                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn login-btn">
                        Login <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                    
                    <p class="signup-link">
                        Don't have an account? <a href="{% url 'accounts:signup' %}">Sign Up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
